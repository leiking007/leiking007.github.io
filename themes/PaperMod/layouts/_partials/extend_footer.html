{{- /* 站点级交互增强脚本：吸顶阴影、阅读进度、目录高亮、图片预览、表格滚动 */ -}}
<script>
    (() => {
        const header = document.querySelector('.header');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* 吸顶导航滚动阴影 */
        if (header) {
            const updateHeader = () => {
                header.classList.toggle('is-scrolled', window.scrollY > 4);
            };
            updateHeader();
            window.addEventListener('scroll', updateHeader, { passive: true });
        }

        /* 阅读进度条：仅文章详情页（mainSections），关于页等独立页面不显示 */
        const postLayout = document.querySelector('.post-layout');
        const readingSections = ['{{ delimit site.MainSections "','" }}'];
        if (postLayout && readingSections.includes(postLayout.dataset.section)) {
            const progress = document.createElement('div');
            progress.className = 'reading-progress';
            progress.setAttribute('aria-hidden', 'true');
            document.body.appendChild(progress);

            const updateProgress = () => {
                const scrollable = document.documentElement.scrollHeight - window.innerHeight;
                const ratio = scrollable > 0 ? Math.min(1, window.scrollY / scrollable) : 0;
                progress.style.transform = `scaleX(${ratio})`;
            };
            updateProgress();
            window.addEventListener('scroll', updateProgress, { passive: true });
            window.addEventListener('resize', updateProgress);
        }

        /* 目录滚动高亮 */
        const tocLinks = Array.from(document.querySelectorAll('.post-toc-side #TableOfContents a[href^="#"]'));
        if (tocLinks.length) {
            const pairs = tocLinks
                .map((link) => {
                    const id = decodeURIComponent(link.hash.slice(1));
                    const heading = document.getElementById(id);
                    return heading ? { link, heading } : null;
                })
                .filter(Boolean);

            let current = null;
            const setActive = (link) => {
                if (link === current) return;
                current = link;
                tocLinks.forEach((item) => item.classList.remove('is-active'));
                if (link) {
                    link.classList.add('is-active');
                    link.setAttribute('aria-current', 'location');
                }
            };

            const updateToc = () => {
                const offset = (header?.offsetHeight || 60) + 24;
                let active = pairs[0]?.link || null;
                for (const pair of pairs) {
                    if (pair.heading.getBoundingClientRect().top - offset <= 0) {
                        active = pair.link;
                    } else {
                        break;
                    }
                }
                setActive(active);
            };

            updateToc();
            window.addEventListener('scroll', updateToc, { passive: true });
            window.addEventListener('resize', updateToc);
        }

        /* 文章图片点击放大 */
        const postImages = Array.from(document.querySelectorAll('.post-content img'))
            .filter((img) => !img.closest('a') && !img.classList.contains('in-text'));

        if (postImages.length) {
            const lightbox = document.createElement('div');
            lightbox.className = 'image-lightbox';
            lightbox.setAttribute('role', 'dialog');
            lightbox.setAttribute('aria-modal', 'true');
            lightbox.setAttribute('aria-label', '图片预览');
            lightbox.innerHTML = '<button type="button" class="image-lightbox-close" aria-label="关闭预览">&times;</button><img alt="">';
            document.body.appendChild(lightbox);

            const lightboxImg = lightbox.querySelector('img');
            const closeButton = lightbox.querySelector('.image-lightbox-close');
            let lastFocused = null;

            const closeLightbox = () => {
                lightbox.classList.remove('is-open');
                document.documentElement.classList.remove('lightbox-open');
                lightboxImg.removeAttribute('src');
                lastFocused?.focus({ preventScroll: true });
            };

            const openLightbox = (img) => {
                lastFocused = document.activeElement;
                lightboxImg.src = img.currentSrc || img.src;
                lightboxImg.alt = img.alt || '';
                lightbox.classList.add('is-open');
                document.documentElement.classList.add('lightbox-open');
                closeButton.focus();
            };

            postImages.forEach((img) => {
                img.classList.add('zoomable');
                img.addEventListener('click', () => {
                    if (img.naturalWidth < 120 || img.naturalHeight < 120) return;
                    openLightbox(img);
                });
            });

            lightbox.addEventListener('click', (event) => {
                if (event.target === lightbox || event.target === lightboxImg) closeLightbox();
            });
            closeButton.addEventListener('click', closeLightbox);
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && lightbox.classList.contains('is-open')) closeLightbox();
            });
            if (reduceMotion) lightbox.classList.add('no-motion');
        }

        /* 宽表格横向滚动 */
        document.querySelectorAll('.post-content table').forEach((table) => {
            if (table.closest('.highlight')) return;
            const wrapper = document.createElement('div');
            wrapper.className = 'table-wrapper';
            table.parentNode.insertBefore(wrapper, table);
            wrapper.appendChild(table);
        });
    })();
</script>
