<div
        x-data="imageLightbox"
        @keydown.escape.window="closeLightbox()"
        @keydown.left.window="prevImage()"
        @keydown.right.window="nextImage()"
        @mouseup="stopDrag()" @touchend="stopDrag()"
        @mousemove="performDrag($event)" @touchmove="performDrag($event)"
        class="container mx-auto"
>
    <!-- 灯箱模态框 -->
    <div
            x-show="isOpen"
            x-cloak
            class="fixed inset-0 z-200 flex items-center justify-center bg-tl-base-100/75 p-4"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start=""
            x-transition:enter-end=""
            x-transition:leave="transition ease-in duration-50"
            x-transition:leave-start=""
            x-transition:leave-end=""
            @click="closeLightbox()"
    >
        <div
                class="bg-tl-base-100 rounded-lg shadow-2xl p-4 max-w-[90vw] max-h-[90vh] relative flex flex-col"
                @click.stop
        >
            <!-- 关闭按钮 -->
            <button @click="closeLightbox()"
                    class="absolute -top-3 -right-3 text-tl-error-content  bg-tl-error/80 hover:bg-tl-error rounded-full w-8 h-8 flex items-center justify-center transition-colors">
                ×
            </button>

            <!-- 图片容器 (重要：添加 x-ref) -->
            <div
                    x-ref="imageContainer"
                    class="grow flex items-center justify-center overflow-hidden mb-2 relative group"
            >
                <img
                        :src="currentImageSrc"
                        :alt="currentImageAlt"
                        class="lightbox-image max-w-full max-h-[calc(90vh-120px)] object-contain rounded"
                        :class="{ 'dragging': isDragging }"
                        :style="{
                            transform: `translateX(${currentImageX}px) translateY(${currentImageY}px) scale(${zoomLevel})`,
                            transformOrigin: transformOrigin,
                            cursor: cursorStyle()
                        }"
                        @wheel.prevent="handleWheel($event)"
                        @mousedown="initDrag($event)" @touchstart.passive="initDrag($event)"
                        @load="updateBaseDimensions()"
                        x-ref="lightboxImage"
                        x-transition:enter="transition ease-out duration-150"
                        x-transition:enter-start="transform scale-95"
                        x-transition:enter-end="transform scale-100"
                        x-transition:leave="transition ease-in duration-150"
                        x-transition:leave-start="transform scale-100"
                        x-transition:leave-end="transform scale-95"
                >
                <div x-show="!isZoomed() && isOpen && !isDragging"
                     class="absolute bottom-2 left-1/2 -translate-x-1/2 bg-tl-info text-tl-info-content text-xs px-2 py-1 rounded transition-opacity duration-300 pointer-events-none">
                    {{ T "ui.scroll_to_zoom" | default "使用滚轮缩放" }}
                </div>
                <div x-show="isZoomed() && isOpen && !isDragging"
                     class="absolute bottom-2 left-1/2 -translate-x-1/2 bg-tl-info text-tl-info-content text-xs px-2 py-1 rounded transition-opacity duration-300 pointer-events-none">
                    {{ T "ui.drag_to_pan" | default "按住拖动" }}
                </div>

                <!-- 多图导航 -->
                <button x-show="hasMultiple" x-cloak @click.stop="prevImage()"
                        class="absolute left-2 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center rounded-full bg-tl-base-100/80 hover:bg-tl-base-200 text-tl-base-content shadow transition-colors"
                        aria-label="prev">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <button x-show="hasMultiple" x-cloak @click.stop="nextImage()"
                        class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center rounded-full bg-tl-base-100/80 hover:bg-tl-base-200 text-tl-base-content shadow transition-colors"
                        aria-label="next">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </button>
            </div>

            <!-- 图片描述和导航 -->
            <div class="flex items-center justify-between pt-2 border-t border-tl-base-300">
                <p class="text-sm" x-text="currentImageAlt"></p>
                <span x-show="hasMultiple" x-cloak class="text-xs text-tl-base-content/50"
                      x-text="(currentIndex + 1) + ' / ' + images.length"></span>
            </div>
        </div>
    </div>
</div>
