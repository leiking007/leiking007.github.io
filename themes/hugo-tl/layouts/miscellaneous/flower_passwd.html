{{ define "main" }}
<section class="mx-auto mt-6 grid max-w-[90rem] gap-6 px-4 md:px-6">
    <div x-data="flowerPasswordGenerator" class="m-auto p-8 rounded-lg shadow-md bg-tl-base-100 w-full max-w-md">
        <h1 class="text-3xl font-bold mb-4">花密 Flower Password</h1>
        <p class="mb-6">请输入记忆密码和区分代号</p>
        <div class="mb-4">
            <label for="memoryPassword" class="block text-sm font-bold mb-2">记忆密码</label>
            <input x-model="memoryPassword" type="password" id="memoryPassword"
                   class="w-full border border-tl-base-300 bg-tl-base-200 p-2 rounded-md focus:outline-tl-primary">
        </div>
        <div class="mb-6">
            <label for="distinguishCode" class="block text-sm font-bold mb-2">区分代号</label>
            <input x-model="distinguishCode" type="text" id="distinguishCode"
                   class="w-full border border-tl-base-300 bg-tl-base-200 p-2 rounded-md focus:outline-tl-primary">
        </div>
        <div class="mb-6">
            <span x-ref="passwdRef"></span>
        </div>
    </div>
</section>
{{ end }}
{{ define "script" }}
{{/* 花密组件独立入口：crypto-js 仅在该页面加载，不打包进全站主 JS */}}
{{- $flowerjs := resources.Get "ts/flower.ts" | js.Build (dict "minify" hugo.IsProduction) | resources.Fingerprint "sha256" }}
<script type="text/javascript" src="{{ $flowerjs.RelPermalink }}" integrity="{{ $flowerjs.Data.Integrity }}" crossorigin="anonymous" defer></script>
{{ end }}
